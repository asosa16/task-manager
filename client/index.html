<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Hero Web</title>
    <meta
      name="description"
      content="Hero is a fast, opinionated task manager rebuilt for the web with project tagging, a due-task focus flow, and Google-ready authentication." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />
    <link
      rel="icon"
      type="image/png"
      href="https://d2xsxph8kpxj0f.cloudfront.net/310519663183942827/auuJbr6QdBfQAgc8r4WcfX/hero-128_efe10397.png" />
  </head>
  <body>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f6f3;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        color: rgba(0, 0, 0, 0.55);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        gap: 10px;
      }
      #initial-loader .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: currentColor;
        animation: initial-loader-pulse 1.1s ease-in-out infinite;
      }
      #initial-loader .dot:nth-child(2) { animation-delay: 0.15s; }
      #initial-loader .dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes initial-loader-pulse {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1); }
      }
    </style>
    <div id="root">
      <div id="initial-loader" role="status" aria-label="Loading Hero">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span>Hero</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (endpoint.charAt(0) === "%" || websiteId.charAt(0) === "%") return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = endpoint + "/umami";
        s.setAttribute("data-website-id", websiteId);
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
